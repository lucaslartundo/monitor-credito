# El recolector corre en TU MAC (doble clic en actualizar.command), no aquí,
# porque necesita las API keys de Firecrawl y Anthropic.
#
# Si algún día quieres que corra solo en GitHub, hay que meter las keys como
# "secrets" del repositorio (Settings > Secrets > Actions) y descomentar abajo.
name: Recolectar (manual, requiere secrets)
on:
  workflow_dispatch:
    inputs:
      dias: { description: 'Días atrás', default: '11' }
